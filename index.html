<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060608" />
  <title>LifeForge — Forge ta vie</title>
  <meta name="description" content="LifeForge — Plateforme d'apprentissage adaptatif. 607 formations, moteur cognitif 7 axes, programmes 100% personnalisés." />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🧬</text></svg>" />
  <style>
/* LifeForge — Design System
 * Inspiré de lifeforge_v19.html (dark + glow purple/cyan)
 * Variables CSS pour tous les composants
 */

:root {
  /* Backgrounds */
  --bg:      #060608;
  --surface: #0e0f14;
  --surface2:#161820;
  --surface3:#1e2030;
  --border:  rgba(255,255,255,.06);
  --border2: rgba(255,255,255,.12);

  /* Text */
  --text:    #f2f4ff;
  --muted:   #5a607a;
  --muted2:  #8890aa;

  /* Accents (8 catégories KB + extras) */
  --v1: #c084fc;     /* purple primary */
  --v2: #a855f7;
  --c1: #22d3ee;     /* cyan */
  --c2: #06b6d4;
  --o1: #fb923c;     /* orange */
  --o2: #f97316;
  --g1: #4ade80;     /* green */
  --p1: #f472b6;     /* pink */
  --y1: #fbbf24;     /* yellow */
  --red: #f87171;
  --blue: #60a5fa;
  --grey: #9ca3af;

  /* Gradients */
  --grad-main:  linear-gradient(135deg, #c084fc, #22d3ee);
  --grad-warm:  linear-gradient(135deg, #fb923c, #f472b6);
  --grad-green: linear-gradient(135deg, #4ade80, #22d3ee);
  --grad-fire:  linear-gradient(135deg, #fb923c, #fbbf24);

  /* Radii */
  --r:  20px;
  --r2: 14px;
  --r3: 10px;

  /* Shadows / glow */
  --shadow: 0 24px 80px rgba(0,0,0,.6);
  --glow-v: 0 0 40px rgba(192,132,252,.20);
  --glow-c: 0 0 40px rgba(34,211,238,.20);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 800px 600px at 20% 10%,  rgba(192,132,252,.06) 0%, transparent 70%),
    radial-gradient(ellipse 600px 800px at 80% 80%,  rgba(34,211,238,.05)  0%, transparent 70%),
    radial-gradient(ellipse 500px 400px at 60% 30%,  rgba(251,146,60,.04)  0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ── Header ───────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,6,8,.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-wrap {
  max-width: 1200px; margin: 0 auto;
  padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.logo {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: var(--grad-main);
  display: grid; place-items: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 15px;
  color: #060608;
  box-shadow: var(--glow-v);
  transition: box-shadow .3s;
}
.logo:hover { box-shadow: 0 0 60px rgba(192,132,252,.5); }
.brand-name {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 18px;
  background: var(--grad-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -.02em;
}
.nav { display: flex; gap: 4px; flex-wrap: wrap; }

/* ── Pills (nav buttons) ──────────────────────────────────────── */
.pill {
  background: transparent;
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--muted2);
  font: 500 13px 'DM Sans', sans-serif;
  transition: all .2s;
}
.pill:hover { border-color: rgba(192,132,252,.3); color: var(--text); }
.pill.active {
  border-color: rgba(192,132,252,.5);
  color: var(--v1);
  background: rgba(192,132,252,.08);
  box-shadow: 0 0 20px rgba(192,132,252,.15);
}

/* ── Main layout ──────────────────────────────────────────────── */
main {
  max-width: 1200px; margin: 0 auto;
  padding: 28px 20px 80px;
  position: relative; z-index: 1;
}
.grid { display: grid; gap: 16px; }
@media (min-width: 800px) {
  .grid.g2  { grid-template-columns: 1fr 1fr; }
  .grid.g3  { grid-template-columns: 1fr 1fr 1fr; }
  .grid.g4  { grid-template-columns: repeat(4, 1fr); }
  .grid.g12 { grid-template-columns: 1.45fr 1fr; }
  .grid.g21 { grid-template-columns: 1fr 1.45fr; }
  .grid.g13 { grid-template-columns: 1fr 3fr; }
}

/* ── Cards ────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 22px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  transition: border-color .3s, box-shadow .3s, transform .2s;
}
.card:hover { border-color: rgba(255,255,255,.1); }
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.025), transparent 60%);
  pointer-events: none;
  border-radius: var(--r);
}
.card-glow { box-shadow: var(--shadow), var(--glow-v); }
.card-clickable { cursor: pointer; }
.card-clickable:hover { transform: translateY(-2px); }

/* ── Buttons ──────────────────────────────────────────────────── */
.btn {
  border: none; cursor: pointer;
  font: 600 14px 'DM Sans', sans-serif;
  border-radius: var(--r2);
  padding: 10px 18px;
  transition: all .2s;
}
.btn-primary {
  background: var(--grad-main);
  color: #060608; font-weight: 700;
  box-shadow: 0 0 28px rgba(192,132,252,.35);
}
.btn-primary:hover {
  box-shadow: 0 0 45px rgba(192,132,252,.55);
  transform: translateY(-1px);
}
.btn-orange {
  background: var(--grad-warm);
  color: #060608; font-weight: 700;
  box-shadow: 0 0 28px rgba(251,146,60,.3);
}
.btn-ghost {
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-ghost:hover { background: rgba(255,255,255,.10); border-color: var(--border2); }
.btn-danger {
  background: rgba(251,113,133,.10);
  border: 1px solid rgba(251,113,133,.2);
  color: #fb7185;
}
.btn-danger:hover { background: rgba(251,113,133,.18); }
.btn-full { width: 100%; }
.btn-sm   { padding: 7px 13px; font-size: 12px; border-radius: 10px; }
.btn-matrix {
  background: linear-gradient(135deg, rgba(192,132,252,.15), rgba(34,211,238,.10));
  border: 1px solid rgba(192,132,252,.3);
  color: var(--v1); font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: var(--r2);
  transition: all .25s;
  cursor: pointer;
}
.btn-matrix:hover {
  background: linear-gradient(135deg, rgba(192,132,252,.25), rgba(34,211,238,.20));
  box-shadow: 0 0 30px rgba(192,132,252,.25);
  transform: translateY(-1px);
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* ── Progress bar ─────────────────────────────────────────────── */
.bar-wrap {
  height: 5px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  overflow: hidden; margin-top: 12px;
}
.bar-fill {
  height: 100%;
  background: var(--grad-main);
  border-radius: 999px;
  transition: width .8s cubic-bezier(.16,1,.3,1);
  position: relative;
}
.bar-fill::after {
  content: '';
  position: absolute; right: 0; top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--v1);
  box-shadow: 0 0 8px var(--v1);
}
.bar-fill.warm  { background: var(--grad-warm); }
.bar-fill.green { background: var(--grad-green); }

/* ── Badges (par catégorie) ───────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10px; font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  border: 1px solid;
}
.badge-fit  { background: rgba(251,113,133,.12); color: #fb7185; border-color: rgba(251,113,133,.2); }
.badge-edu  { background: rgba(192,132,252,.12); color: #c084fc; border-color: rgba(192,132,252,.2); }
.badge-fin  { background: rgba(74,222,128,.12);  color: #4ade80; border-color: rgba(74,222,128,.2);  }
.badge-tech { background: rgba(34,211,238,.12);  color: #22d3ee; border-color: rgba(34,211,238,.2);  }
.badge-art  { background: rgba(244,114,182,.12); color: #f472b6; border-color: rgba(244,114,182,.2); }
.badge-sci  { background: rgba(96,165,250,.12);  color: #60a5fa; border-color: rgba(96,165,250,.2);  }
.badge-dev  { background: rgba(251,146,60,.12);  color: #fb923c; border-color: rgba(251,146,60,.2);  }
.badge-met  { background: rgba(248,113,113,.12); color: #f87171; border-color: rgba(248,113,113,.2); }
.badge-spi  { background: rgba(167,139,250,.12); color: #a78bfa; border-color: rgba(167,139,250,.2); }

/* ── Quiz ─────────────────────────────────────────────────────── */
.quiz-box {
  background: rgba(192,132,252,.06);
  border: 1px solid rgba(192,132,252,.15);
  border-radius: var(--r2);
  padding: 16px;
  margin-top: 16px;
}
.quiz-q { font-weight: 700; font-size: 14px; margin-bottom: 12px; color: var(--v1); }
.quiz-options { display: grid; gap: 8px; }
.quiz-opt {
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer; text-align: left;
  font: 500 13px 'DM Sans', sans-serif;
  color: var(--text);
  transition: all .2s;
}
.quiz-opt:hover { border-color: rgba(192,132,252,.4); background: rgba(192,132,252,.08); }
.quiz-opt.correct { background: rgba(74,222,128,.15); border-color: var(--g1); color: var(--g1); }
.quiz-opt.wrong   { background: rgba(251,113,133,.10); border-color: #fb7185; color: #fb7185; }
.quiz-opt:disabled { cursor: not-allowed; }
.quiz-fb { margin-top: 10px; font-size: 13px; color: var(--muted2); line-height: 1.5; }

/* ── Matrix panel ─────────────────────────────────────────────── */
.matrix-panel {
  background: linear-gradient(135deg, rgba(192,132,252,.06), rgba(34,211,238,.04));
  border: 1px solid rgba(192,132,252,.2);
  border-radius: var(--r);
  padding: 20px;
  position: relative; overflow: hidden;
}
.matrix-panel::before {
  content: '';
  position: absolute; right: -100px; bottom: -100px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(192,132,252,.08), transparent 70%);
  pointer-events: none;
}
.matrix-tag {
  font-size: 10px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--v1);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.matrix-tag::before { content: '◈'; font-size: 12px; }

.mx-scores {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 8px; margin: 14px 0;
}
.mx-score {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 4px;
  text-align: center;
  position: relative;
}
.mx-score-name { font-size: 9px; color: var(--muted2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.mx-score-val  { font-size: 18px; font-weight: 800; color: var(--v1); font-family: 'Syne', sans-serif; }
.mx-score-bar  { height: 3px; background: rgba(255,255,255,.05); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.mx-score-fill { height: 100%; background: var(--grad-main); border-radius: 2px; }

/* Z dimensions display */
.z-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); padding: 14px; }
.z-title { font-size: 11px; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.z-row   { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; }
.z-label { flex: 1; color: var(--text); }
.z-pct   { font-weight: 700; color: var(--v1); font-family: 'Syne', sans-serif; min-width: 36px; text-align: right; }
.z-bar   { height: 4px; flex: 2; background: rgba(255,255,255,.05); border-radius: 2px; overflow: hidden; }
.z-fill  { height: 100%; border-radius: 2px; }

/* ── Hero / Section labels ───────────────────────────────────── */
.section-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted2); margin-bottom: 10px;
}
h1, h2, h3 { font-family: 'Syne', sans-serif; letter-spacing: -.01em; }
h1 { font-size: 32px; font-weight: 800; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
.muted  { color: var(--muted2); }
.muted-sm { color: var(--muted); font-size: 12px; }

/* ── XP bar ───────────────────────────────────────────────────── */
.xp-bar {
  display: flex; gap: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 14px 18px;
  align-items: center;
  flex-wrap: wrap;
}
.xp-stat { display: flex; flex-direction: column; gap: 2px; }
.xp-stat-value { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; color: var(--v1); }
.xp-stat-label { font-size: 10px; color: var(--muted2); text-transform: uppercase; letter-spacing: .06em; }
.xp-progress {
  flex: 1; min-width: 180px;
  display: flex; flex-direction: column; gap: 4px;
}
.xp-progress-label { font-size: 11px; color: var(--muted2); display: flex; justify-content: space-between; }

/* ── Lists & items ────────────────────────────────────────────── */
.kb-row {
  display: flex; align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  cursor: pointer;
  transition: all .2s;
}
.kb-row:hover {
  border-color: rgba(192,132,252,.3);
  background: rgba(192,132,252,.04);
  transform: translateX(2px);
}
.kb-row-emoji { font-size: 24px; }
.kb-row-info { flex: 1; min-width: 0; }
.kb-row-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.kb-row-sub { font-size: 11px; color: var(--muted2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Task & Lesson rows ──────────────────────────────────────── */
.task-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  margin-bottom: 8px;
}
.task-row.done { opacity: .55; }
.task-row.done .task-title { text-decoration: line-through; }
.task-cb {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border2);
  cursor: pointer;
  display: grid; place-items: center;
  transition: all .2s;
  flex-shrink: 0;
}
.task-cb:hover { border-color: var(--v1); }
.task-cb.checked { background: var(--grad-main); border-color: transparent; }
.task-cb.checked::after { content: '✓'; color: #060608; font-weight: 800; font-size: 14px; }
.task-info { flex: 1; min-width: 0; }
.task-title { font-weight: 600; font-size: 14px; }
.task-detail { font-size: 12px; color: var(--muted2); margin-top: 2px; }
.task-impact {
  background: rgba(192,132,252,.10);
  color: var(--v1);
  font-size: 10px; font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
}

/* ── Search input ─────────────────────────────────────────────── */
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 12px 16px;
  color: var(--text);
  font: 500 14px 'DM Sans', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: rgba(192,132,252,.4); }

/* ── Tag chips for categories ────────────────────────────────── */
.chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: rgba(192,132,252,.3); }
.chip.active { background: rgba(192,132,252,.12); color: var(--v1); border-color: rgba(192,132,252,.4); }

/* ── Toast ────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 12px 24px;
  border-radius: var(--r2);
  box-shadow: var(--shadow);
  font-weight: 600; font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: all .4s cubic-bezier(.16,1,.3,1);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Modal ────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(8px);
  display: grid; place-items: center;
  z-index: 150;
  animation: fadeIn .2s ease-out;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px;
  max-width: 520px; width: calc(100% - 40px);
  max-height: 86vh; overflow-y: auto;
  box-shadow: var(--shadow);
  animation: slideUp .3s cubic-bezier(.16,1,.3,1);
}
.modal-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  color: var(--text);
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 16px;
}

/* ── Forms ────────────────────────────────────────────────────── */
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-row label { font-size: 11px; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: .06em; }
.form-row input,
.form-row select,
.form-row textarea {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  padding: 10px 14px;
  color: var(--text);
  font: 500 14px 'DM Sans', sans-serif;
  outline: none;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus { border-color: rgba(192,132,252,.4); }

/* ── Empty state ──────────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted2);
}
.empty-icon { font-size: 56px; margin-bottom: 14px; opacity: .8; }
.empty-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-text { font-size: 13px; color: var(--muted2); max-width: 360px; margin: 0 auto 18px; line-height: 1.5; }

/* ── Animations ───────────────────────────────────────────────── */
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
.pulse { animation: pulse 2s ease-in-out infinite; }

/* ── Heat map (weekly activity) ──────────────────────────────── */
.heat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.heat-cell {
  aspect-ratio: 1;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 9px; color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
}
.heat-cell.active {
  background: rgba(192,132,252,.20);
  border-color: rgba(192,132,252,.4);
  color: var(--v1);
}

/* ── Responsive ───────────────────────────────────────────────── */
@media (max-width: 700px) {
  .header-wrap { flex-direction: column; align-items: flex-start; }
  .nav { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .pill { white-space: nowrap; }
  main { padding: 16px 12px 60px; }
  .card { padding: 16px; }
  h1 { font-size: 24px; }
  h2 { font-size: 18px; }
  .mx-scores { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mx-score { padding: 6px 2px; }
  .mx-score-val { font-size: 14px; }
}


/* ── v22 Supabase / Onboarding / Mentors / Missions / Messages ── */
.ob-step { animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
.ob-title { font-family:'Syne',sans-serif; font-weight:800; font-size:26px; line-height:1.2; margin-bottom:8px; background:var(--grad-main); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.ob-sub   { color:var(--muted2); font-size:14px; line-height:1.6; margin-bottom:24px; }
.ob-key-input { width:100%; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--r2); padding:14px 16px; color:var(--text); font:500 14px 'DM Sans',sans-serif; outline:none; transition:border-color .2s; }
.ob-key-input:focus { border-color:rgba(192,132,252,.5); box-shadow:0 0 0 3px rgba(192,132,252,.08); }
.ob-dots  { display:flex; gap:8px; justify-content:center; margin-bottom:32px; }
.ob-dot   { width:8px; height:8px; border-radius:50%; background:var(--border2); transition:background .3s; }
.ob-dot.active { background:var(--v1); box-shadow:0 0 8px rgba(192,132,252,.5); }
.axis-slider-wrap { margin-bottom:16px; }
.axis-label  { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13px; font-weight:600; }
.axis-val    { font-family:'Syne',sans-serif; font-weight:800; font-size:18px; color:var(--v1); }
.axis-range  { width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:var(--surface3); outline:none; cursor:pointer; }
.axis-range::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%; background:var(--grad-main); box-shadow:0 0 12px rgba(192,132,252,.4); cursor:pointer; }
.domain-checks { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.domain-check  { display:flex; align-items:center; gap:8px; padding:11px 13px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--r3); cursor:pointer; font-size:13px; font-weight:500; transition:all .2s; user-select:none; }
.domain-check.sel { background:rgba(192,132,252,.12); border-color:rgba(192,132,252,.4); color:var(--v1); }
.mentor-filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
.mentor-filters::-webkit-scrollbar { display:none; }
.mf-chip { flex-shrink:0; padding:6px 13px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted2); font:500 12px 'DM Sans',sans-serif; cursor:pointer; transition:all .2s; }
.mf-chip.active { background:rgba(192,132,252,.12); border-color:rgba(192,132,252,.4); color:var(--v1); }
.mentor-grid { display:grid; gap:12px; }
@media(min-width:600px){ .mentor-grid { grid-template-columns:1fr 1fr; } }
.mentor-card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; transition:all .25s; cursor:pointer; overflow:hidden; }
.mentor-card:hover { border-color:rgba(192,132,252,.3); transform:translateY(-2px); }
.mentor-avatar { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; font-size:26px; margin-bottom:12px; }
.mentor-name   { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
.mentor-bio    { font-size:12px; color:var(--muted2); line-height:1.5; margin-bottom:10px; }
.mentor-lock   { position:absolute; inset:0; background:rgba(6,6,8,.75); backdrop-filter:blur(6px); border-radius:var(--r); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
.lock-badge    { background:var(--grad-warm); color:#060608; font-weight:700; font-size:12px; padding:6px 14px; border-radius:999px; }
.toggle-wrap   { display:flex; gap:0; background:var(--surface2); border-radius:999px; padding:3px; width:fit-content; margin-bottom:18px; }
.toggle-opt    { padding:8px 18px; border-radius:999px; font:600 13px 'DM Sans',sans-serif; cursor:pointer; transition:all .2s; color:var(--muted2); }
.toggle-opt.on { background:var(--grad-main); color:#060608; box-shadow:0 0 20px rgba(192,132,252,.3); }
.msg-list      { display:flex; flex-direction:column; gap:8px; }
.msg-conv      { display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r2); cursor:pointer; transition:all .2s; }
.msg-conv:hover{ border-color:rgba(192,132,252,.25); }
.msg-conv-avatar{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; flex-shrink:0; }
.msg-conv-name { font-weight:700; font-size:14px; }
.msg-conv-preview{ font-size:12px; color:var(--muted2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
.msg-conv-time  { font-size:11px; color:var(--muted); margin-left:auto; flex-shrink:0; }
.msg-unread     { background:var(--v1); color:#060608; border-radius:999px; font-size:10px; font-weight:800; padding:2px 7px; }
.chat-wrap      { display:flex; flex-direction:column; height:calc(100vh - 160px); min-height:400px; }
.chat-header    { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.chat-msgs      { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 0; }
.chat-bubble    { max-width:78%; padding:11px 14px; border-radius:18px; font-size:14px; line-height:1.5; }
.chat-bubble.me   { align-self:flex-end; background:rgba(192,132,252,.18); border:1px solid rgba(192,132,252,.25); border-bottom-right-radius:4px; }
.chat-bubble.them { align-self:flex-start; background:var(--surface2); border:1px solid var(--border); border-bottom-left-radius:4px; }
.chat-bubble-time { font-size:10px; color:var(--muted); margin-top:4px; text-align:right; }
.chat-input-wrap{ display:flex; gap:8px; margin-top:12px; }
.chat-input     { flex:1; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--r2); padding:12px 14px; color:var(--text); font:400 14px 'DM Sans',sans-serif; outline:none; resize:none; transition:border-color .2s; }
.chat-input:focus{ border-color:rgba(192,132,252,.4); }
.mission-card   { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; transition:all .25s; }
.mission-card.done{ opacity:.5; }
.mission-xp     { display:inline-block; background:rgba(251,146,60,.12); border:1px solid rgba(251,146,60,.2); color:var(--o1); border-radius:999px; font-size:11px; font-weight:700; padding:3px 10px; margin-bottom:10px; }
.sat-stars      { display:flex; gap:8px; justify-content:center; margin:16px 0; }
.sat-star       { font-size:32px; cursor:pointer; transition:transform .15s; opacity:.35; }
.sat-star.lit   { opacity:1; transform:scale(1.1); }
.sb-status      { display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 10px; border-radius:999px; }
.sb-ok   { background:rgba(74,222,128,.1); color:var(--g1); border:1px solid rgba(74,222,128,.2); }
.sb-fail { background:rgba(248,113,113,.1); color:var(--red); border:1px solid rgba(248,113,113,.2); }
.role-badge { display:inline-block; padding:4px 11px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.role-mentor   { background:rgba(34,211,238,.12); color:var(--c1); border:1px solid rgba(34,211,238,.2); }
.role-learner  { background:rgba(192,132,252,.12); color:var(--v1); border:1px solid rgba(192,132,252,.2); }

  </style>

// ─── Softmax ─────────────────────────────────────────────────────
function softmax(arr) {
  const max = Math.max(...arr);
  const e = arr.map(v => Math.exp(v - max));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}

// ─── computeZ : projette X (7 axes) sur les 6 dimensions Z ────────
window.LF.computeZ = function(X) {
  const res = {};
  for (const zd of window.LF.ALL_Z) {
    const sc = zd.matrix.W.map((row, i) =>
      zd.matrix.bias[i] + row.reduce((s, w, j) => s + w * X[j], 0)
    );
    const pcts = softmax(sc).map(v => Math.round(v * 100));
    // Compenser arrondi
    const diff = 100 - pcts.reduce((a, b) => a + b, 0);
    if (diff !== 0 && pcts.length > 0) pcts[0] += diff;
    res[zd.key] = {
      title: zd.title,
      labels: zd.matrix.labels,
      pcts,
      color: zd.color,
    };
  }
  return res;
};

// ─── detectProfile : 6 archétypes basés sur X ─────────────────────
window.LF.detectProfile = function(X) {
  const [ve, at, te, rr, ca, pe, mi] = X;
  const profiles = [];

  // Sprinter : vite + court + faible répétition
  if (ve > 0.6 && pe < 0.5) profiles.push({ key: 'sprinter', name: 'Le Sprinteur', score: ve + (1 - pe) });
  // Marathonien : persistance + tolérance répétition + motivation interne
  if (pe > 0.6 && rr > 0.4) profiles.push({ key: 'marathon', name: 'Le Marathonien', score: pe + rr + mi * 0.5 });
  // Penseur : abstraction + attention
  if (ca > 0.6 && at > 0.5) profiles.push({ key: 'thinker', name: 'Le Penseur', score: ca + at });
  // Pragmatique : faible abstraction + tolérance erreur + pratique
  if (ca < 0.4 && te > 0.4) profiles.push({ key: 'doer', name: 'Le Pragmatique', score: (1 - ca) + te });
  // Explorateur : vite + faible répétition + motivation interne
  if (rr < 0.4 && mi > 0.4) profiles.push({ key: 'explorer', name: "L'Explorateur", score: (1 - rr) + mi });
  // Méticuleux : haute répétition + attention + faible vitesse
  if (rr > 0.6 && at > 0.5) profiles.push({ key: 'careful', name: 'Le Méticuleux', score: rr + at });

  if (profiles.length === 0) {
    return { key: 'balanced', name: 'Polyvalent', score: 0, X };
  }

  profiles.sort((a, b) => b.score - a.score);
  return { ...profiles[0], X };
};

// LifeForge — Générateur de programme adapté
// Combine une ligne KB + un profil cognitif (X) + paramètres utilisateur
// pour produire un programme : modules → leçons + tâches.
// Source : v19 generateFullProgram, modularisé et nettoyé.
// ZÉRO IA externe — uniquement règles + projection sur les dimensions Z.

window.LF = window.LF || {};

function cid() {
  try { return crypto.randomUUID(); }
  catch { return 'id' + Math.random().toString(36).slice(2); }
}

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

function mkLesson(title, summary, kpi) {
  return {
    id: cid(),
    title,
    summary: summary || '',
    keyPoints: kpi ? [kpi] : [],
    done: false,
    impact: 2,
    impactMax: 2,
  };
}

function mkTask(title, detail, impact) {
  const i = clamp(impact || 2, 1, 10);
  return {
    id: cid(),
    title,
    detail: detail || '',
    done: false,
    impact: i,
    impactMax: i,
  };
}

// Renvoie le label majoritaire d'une dimension Z
function topLabel(zDim) {
  let best = 0, idx = 0;
  zDim.labels.forEach((_, i) => {
    if (zDim.pcts[i] > best) { best = zDim.pcts[i]; idx = i; }
  });
  return { label: zDim.labels[idx], pct: best };
}

// Génère un programme complet à partir d'une ligne KB
window.LF.generateFullProgram = function(kbRow, X, userLevel, weeksDuration, minsPerDay) {
  if (!kbRow) throw new Error('generateFullProgram: kbRow required');
  X = X || window.LF.MATRIX_AXES.map(() => 0.5);
  userLevel = userLevel || 'Débutant';
  weeksDuration = weeksDuration || 12;
  minsPerDay = minsPerDay || 30;

  const [grand, domaine, sousDomaine, nDeb, nInter, nExp, dureeKB, formatKB, kpi, prereq, emoji, badge] = kbRow;
  const Z = window.LF.computeZ(X);
  const profile = window.LF.detectProfile(X);
  const dm = window.LF.DOMAIN_META[grand] || window.LF.DOMAIN_META['ÉDUCATION'];

  // Choix pédagogiques majoritaires
  const topE = topLabel(Z.E); // type d'exercice
  const topT = topLabel(Z.T); // support
  const topS = topLabel(Z.S); // structure de session
  const topH = topLabel(Z.H); // potentiel temporel

  // Durée de session selon préférence
  let sessionDuration;
  if (topS.label === 'Micro-sessions') sessionDuration = Math.min(minsPerDay, 25);
  else if (topS.label === 'Blocs longs') sessionDuration = Math.max(minsPerDay, 45);
  else if (topS.label === 'Immersion') sessionDuration = Math.max(minsPerDay, 60);
  else sessionDuration = minsPerDay;

  // Texte du niveau cible
  const levelDescription = {
    'Débutant':      { target: nDeb,   prefix: 'Niveau 1', icon: '🌱' },
    'Intermédiaire': { target: nInter, prefix: 'Niveau 2', icon: '🌿' },
    'Avancé':        { target: nExp,   prefix: 'Niveau 3', icon: '🌳' },
  };
  const levelInfo = levelDescription[userLevel] || levelDescription['Débutant'];

  // Découpage en modules : 4 phases × N semaines/phase
  const phases = [
    { name: 'Fondations',     focus: 'Bases techniques et vocabulaire',     weight: 0.25 },
    { name: 'Application',    focus: 'Mise en pratique encadrée',           weight: 0.30 },
    { name: 'Autonomie',      focus: 'Pratique libre et erreurs',           weight: 0.25 },
    { name: 'Consolidation',  focus: 'Combinaison et performance',          weight: 0.20 },
  ];

  const modules = phases.map((phase, i) => {
    const phaseWeeks = Math.max(1, Math.round(weeksDuration * phase.weight));

    // Leçons : type adapté au support préféré (topT.label)
    const lessons = [];
    if (topT.label === 'Vidéo' || topT.label === 'Démonstration') {
      lessons.push(mkLesson(
        `${phase.name} — Démo visuelle`,
        `Regarde et reproduis une démonstration de ${sousDomaine}.`,
        `Compléter ${phaseWeeks} démos`
      ));
    } else if (topT.label === 'Schéma') {
      lessons.push(mkLesson(
        `${phase.name} — Cartographie mentale`,
        `Trace les schémas et modèles mentaux de ${sousDomaine}.`,
        `1 carte mentale propre par semaine`
      ));
    } else if (topT.label === 'Interaction') {
      lessons.push(mkLesson(
        `${phase.name} — Échange & feedback`,
        `Discute avec un pair, un coach ou un groupe sur ${sousDomaine}.`,
        `1 session d'échange / semaine`
      ));
    } else {
      lessons.push(mkLesson(
        `${phase.name} — Lecture & notes`,
        `Étudie un texte de référence sur ${sousDomaine} et prends des notes structurées.`,
        `${phaseWeeks * 2} pages de notes`
      ));
    }

    // Une leçon spécifique au type d'exercice
    if (topE.label === 'Pratique libre') {
      lessons.push(mkLesson(
        `${phase.name} — Pratique libre`,
        `Choisis librement un défi à ton niveau et exécute-le.`,
        `${phaseWeeks} défis menés au bout`
      ));
    } else if (topE.label === 'Simulation') {
      lessons.push(mkLesson(
        `${phase.name} — Simulation`,
        `Reproduis une situation réaliste dans un contexte sécurisé.`,
        `1 scénario simulé/semaine`
      ));
    } else if (topE.label === 'Résolution problème') {
      lessons.push(mkLesson(
        `${phase.name} — Problèmes à résoudre`,
        `Liste les problèmes typiques de ${sousDomaine} et résous-les.`,
        `${phaseWeeks * 3} problèmes résolus`
      ));
    } else if (topE.label === 'Répétition active') {
      lessons.push(mkLesson(
        `${phase.name} — Drills répétés`,
        `Identifie les patterns récurrents et drille-les à blanc.`,
        `Drills quotidiens 5 min`
      ));
    } else {
      lessons.push(mkLesson(
        `${phase.name} — Exécution guidée`,
        `Suis un parcours pas à pas avec corrections.`,
        `Parcours complété`
      ));
    }

    // Tâches concrètes — impact pondéré par phase
    const tasks = [];
    const baseImpact = 2 + i; // 2,3,4,5 selon phase
    tasks.push(mkTask(
      `Bloque ${sessionDuration} min/jour pour ${sousDomaine}`,
      `Cohérence avec ton profil "${topS.label}" — ${phaseWeeks} semaines.`,
      baseImpact
    ));
    tasks.push(mkTask(
      `Définir un mini-objectif pour la phase "${phase.name}"`,
      phase.focus,
      baseImpact
    ));
    if (i === phases.length - 1) {
      tasks.push(mkTask(
        `Valider le KPI final : ${kpi}`,
        `Tu as ${weeksDuration} semaines pour y arriver.`,
        baseImpact + 2
      ));
    }

    return {
      id: cid(),
      name: `${i + 1}. ${phase.name}`,
      focus: phase.focus,
      weeks: phaseWeeks,
      lessons,
      tasks,
    };
  });

  return {
    id: cid(),
    title: sousDomaine,
    grandDomaine: grand,
    domaine,
    emoji: emoji || dm.emoji,
    badge: badge || dm.badge,
    color: dm.color,
    level: userLevel,
    levelTarget: levelInfo.target,
    levelPrefix: levelInfo.prefix,
    levelIcon: levelInfo.icon,
    kpi,
    prereq,
    weeks: weeksDuration,
    minutesPerDay: minsPerDay,
    sessionDuration,
    sessionStructure: topS.label,
    exerciseType: topE.label,
    supportType: topT.label,
    horizon: topH.label,
    formatKB,
    dureeKB,
    profile,
    Z,
    modules,
    createdAt: new Date().toISOString(),
  };
};

// ─── Helpers métriques sur un programme ──────────────────────────
window.LF.computeGoalProgress = function(goal) {
  let g = 0, m = 0;
  (goal.modules || []).forEach(mo => {
    (mo.lessons || []).forEach(l => { m += l.impactMax; g += l.done ? l.impact : 0; });
    (mo.tasks   || []).forEach(t => { m += t.impactMax; g += t.done ? t.impact : 0; });
  });
  return m > 0 ? Math.min(100, Math.round((g / m) * 100)) : 0;
};

window.LF.computeGlobal = function(goals) {
  let g = 0, m = 0;
  (goals || []).forEach(go => {
    (go.modules || []).forEach(mo => {
      (mo.lessons || []).forEach(l => { m += l.impactMax; g += l.done ? l.impact : 0; });
      (mo.tasks   || []).forEach(t => { m += t.impactMax; g += t.done ? t.impact : 0; });
    });
  });
  return m > 0 ? Math.round((g / m) * 100) : 0;
};

window.LF.daysRemaining = function(goal) {
  const end = new Date(goal.createdAt).getTime() + goal.weeks * 7 * 86400000;
  return Math.max(0, Math.ceil((end - Date.now()) / 86400000));
};

window.LF.hoursTotal = function(goal) {
  return Math.round(goal.minutesPerDay * goal.weeks * 7 / 60);
};


// LifeForge — Recherche & filtrage KB
// Source : v19 searchKB + RN SearchScreen
// Normalisation NFD (sans accent) + scoring multi-mots
// ZÉRO IA externe — pur algorithmique.

window.LF = window.LF || {};

function normalize(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

window.LF.normalize = normalize;

// Recherche plein-texte sur les 9 premiers champs (grand/domaine/sous-domaine/niveaux/kpi)
window.LF.searchKB = function(query, limit) {
  if (!query || query.trim().length < 2) return [];
  const q = normalize(query.trim());
  const words = q.split(/\s+/).filter(Boolean);

  const scored = [];
  for (const row of window.LF.KB) {
    const haystack = normalize(row.slice(0, 9).join(' '));
    // Tous les mots doivent matcher
    if (!words.every(w => haystack.includes(w))) continue;

    // Scoring : bonus si match sur le sous-domaine (row[2]) ou domaine (row[1])
    let score = 0;
    const sd = normalize(row[2]);
    const dm = normalize(row[1]);
    if (sd === q) score += 100;
    else if (sd.startsWith(q)) score += 60;
    else if (sd.includes(q)) score += 30;
    if (dm.includes(q)) score += 10;
    score += words.filter(w => sd.includes(w)).length * 5;
    score -= haystack.length / 100; // pénalise les fiches très longues à match équivalent

    scored.push({ row, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit || 20).map(s => s.row);
};

// Filtrage par catégorie
window.LF.kbByCategory = function(cat, limit) {
  const out = [];
  for (const row of window.LF.KB) {
    if (row[0] === cat) out.push(row);
    if (limit && out.length >= limit) break;
  }
  return out;
};

// Stats par catégorie
window.LF.kbStats = function() {
  const out = {};
  for (const row of window.LF.KB) {
    out[row[0]] = (out[row[0]] || 0) + 1;
  }
  return out;
};

// Trouver une ligne par sous-domaine exact
window.LF.findKB = function(sousDomaine) {
  const q = normalize(sousDomaine);
  return window.LF.KB.find(r => normalize(r[2]) === q) || null;
};


// LifeForge — Moteur de recommandation
// Recommande des formations de la KB qui matchent le profil cognitif
// (sans IA, uniquement règles + scoring).
// Source : nouveauté de la fusion — exploite le Matrix profile pour suggérer.

window.LF = window.LF || {};

// Score d'affinité entre un domaine et un profil cognitif X
function domainAffinity(grandDomaine, X) {
  const [ve, at, te, rr, ca, pe, mi] = X;
  // Heuristiques par grand-domaine (basées sur le coût cognitif typique du domaine)
  const map = {
    'LANGUES':        rr * 0.4 + pe * 0.4 + at * 0.2,
    'ÉDUCATION':      ca * 0.4 + at * 0.3 + pe * 0.3,
    'ARTS & MUSIQUE': te * 0.3 + pe * 0.3 + mi * 0.4,
    'MÉTIERS':        te * 0.3 + pe * 0.4 + (1 - ca) * 0.3,
    'SPORT':          pe * 0.4 + te * 0.3 + mi * 0.3,
    'SOFT SKILLS':    mi * 0.4 + at * 0.3 + ve * 0.3,
    'WAY OF LIFE':    pe * 0.4 + mi * 0.4 + at * 0.2,
    'CULTURE':        ca * 0.4 + mi * 0.3 + at * 0.3,
  };
  return map[grandDomaine] || 0.5;
}

// Recommande N formations sur la base d'un profil et d'éventuels filtres
window.LF.recommendKB = function(X, opts) {
  X = X || window.LF.MATRIX_AXES.map(() => 0.5);
  opts = opts || {};
  const limit = opts.limit || 6;
  const excludeIds = new Set(opts.exclude || []);
  const onlyCategories = opts.categories || null;

  const scored = [];
  for (const row of window.LF.KB) {
    if (onlyCategories && !onlyCategories.includes(row[0])) continue;
    const key = row[2]; // sous-domaine sert d'identifiant naturel
    if (excludeIds.has(key)) continue;
    const score = domainAffinity(row[0], X);
    scored.push({ row, score });
  }

  // Diversifier : on prend les top par catégorie pour éviter d'avoir 6× "Langues"
  // Sauf si l'utilisateur a filtré sur une seule catégorie : alors on prend les meilleurs sans contrainte.
  scored.sort((a, b) => b.score - a.score);
  const out = [];
  const maxPerCat = onlyCategories && onlyCategories.length <= 1 ? Infinity : 2;
  for (const s of scored) {
    if (out.length >= limit) break;
    const cat = s.row[0];
    const count = out.filter(row => row[0] === cat).length;
    if (count >= maxPerCat) continue;
    out.push(s.row);
  }
  return out;
};

// Score "best match" : pour un profil + un goal existant, recommande 3 next steps
window.LF.suggestNextSteps = function(goal, X) {
  if (!goal) return [];
  const opts = { limit: 3, exclude: [goal.title], categories: null };
  // On privilégie les formations du même grand-domaine
  const same = window.LF.recommendKB(X, { ...opts, categories: [goal.grandDomaine] });
  if (same.length >= 3) return same;
  const others = window.LF.recommendKB(X, opts);
  return [...same, ...others.filter(r => r[2] !== goal.title)].slice(0, 3);
};

// LifeForge — Persistance localStorage
// Source : v19 (lf_v8_*) + RN store/storage.js (AsyncStorage)
// On utilise un préfixe versionné lf_final_ pour ne PAS écraser les versions précédentes.

window.LF = window.LF || {};

const K = {
  GOALS:  'lf_final_goals',
  META:   'lf_final_meta',
  AVATAR: 'lf_final_avatar',
  MATRIX: 'lf_final_matrix',
  PREFS:  'lf_final_prefs',
  RES:    'lf_final_resources',
};

function safeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function safeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { console.error('localStorage write failed', key, e); return false; }
}

// ─── Goals ────────────────────────────────────────────────────────
window.LF.loadGoals  = function() { return safeGet(K.GOALS, []); };
window.LF.saveGoals  = function(g) { return safeSet(K.GOALS, g); };
window.LF.addGoal    = function(goal) {
  const g = window.LF.loadGoals();
  g.unshift(goal);
  window.LF.saveGoals(g);
  return g;
};
window.LF.updateGoal = function(updated) {
  const g = window.LF.loadGoals();
  const i = g.findIndex(x => x.id === updated.id);
  if (i !== -1) { g[i] = updated; window.LF.saveGoals(g); }
};
window.LF.deleteGoal = function(id) {
  const g = window.LF.loadGoals().filter(x => x.id !== id);
  window.LF.saveGoals(g);
};
window.LF.findGoal = function(id) {
  return window.LF.loadGoals().find(g => g.id === id) || null;
};

// ─── Meta (XP, streak) ────────────────────────────────────────────
window.LF.loadMeta = function() {
  const m = safeGet(K.META, {});
  return { xp: 0, streak: 0, lastDate: null, totalDone: 0, level: 1, ...m };
};
window.LF.saveMeta = function(m) { return safeSet(K.META, m); };

window.LF.addXP = function(n) {
  const m = window.LF.loadMeta();
  m.xp = (m.xp || 0) + n;
  const today = new Date().toDateString();
  if (m.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    m.streak = (m.lastDate === yesterday) ? (m.streak || 0) + 1 : 1;
    m.lastDate = today;
  }
  m.totalDone = (m.totalDone || 0) + 1;
  // Niveau = floor(sqrt(xp / 50)) + 1 → progression sublinéaire
  m.level = Math.floor(Math.sqrt(m.xp / 50)) + 1;
  window.LF.saveMeta(m);
  return m;
};

window.LF.xpToNextLevel = function(meta) {
  const lvl = meta.level || 1;
  const nextXp = Math.pow(lvl, 2) * 50;
  const prevXp = Math.pow(lvl - 1, 2) * 50;
  const pct = Math.round(((meta.xp - prevXp) / (nextXp - prevXp)) * 100);
  return { current: meta.xp - prevXp, needed: nextXp - prevXp, pct: Math.max(0, Math.min(100, pct)), nextXp };
};

// ─── Avatar (questionnaire optionnel léger) ───────────────────────
window.LF.loadAvatar = function() { return safeGet(K.AVATAR, null); };
window.LF.saveAvatar = function(a) { return safeSet(K.AVATAR, a); };

// ─── Matrix (résultats du moteur de matrices) ─────────────────────
window.LF.loadMatrix = function() { return safeGet(K.MATRIX, null); };
window.LF.saveMatrix = function(m) { return safeSet(K.MATRIX, m); };

// ─── Préférences (thème, langue, etc.) ────────────────────────────
window.LF.loadPrefs = function() {
  return safeGet(K.PREFS, { lang: 'fr', notifications: true });
};
window.LF.savePrefs = function(p) { return safeSet(K.PREFS, p); };

// ─── Ressources personnelles attachées à un sous-domaine ──────────
window.LF.loadResources = function() { return safeGet(K.RES, {}); };
window.LF.saveResources = function(r) { return safeSet(K.RES, r); };
window.LF.addResource = function(sousDomaine, item) {
  const r = window.LF.loadResources();
  r[sousDomaine] = r[sousDomaine] || [];
  r[sousDomaine].push({ ...item, id: 'r' + Date.now() });
  window.LF.saveResources(r);
};

// ─── Reset complet ────────────────────────────────────────────────
window.LF.resetAll = function() {
  Object.values(K).forEach(k => { try { localStorage.removeItem(k); } catch {} });
};

  let t = window.LF.$('lf-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'lf-toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  clearTimeout(window.LF._toastTimer);

window.LF.modal = function(htmlContent, opts) {
  opts = opts || {};
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'lf-modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="position:relative">
      <button class="modal-close" aria-label="Fermer">×</button>
      ${htmlContent}
    </div>
  `;
  document.body.appendChild(overlay);
  // Close handlers
  overlay.querySelector('.modal-close').onclick = closeModal;
  if (opts.closeOnOverlay !== false) {
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  }
  // Run optional onMount callback
  if (typeof opts.onMount === 'function') opts.onMount(overlay);
  return overlay;
};

// Date relative simple
window.LF.relTime = function(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  const dt = Date.now() - t;
  const days = Math.floor(dt / 86400000);
  if (days <= 0) return "aujourd'hui";
  if (days === 1) return 'hier';
  if (days < 7) return `il y a ${days} j`;
  if (days < 30) return `il y a ${Math.floor(days/7)} sem`;
  if (days < 365) return `il y a ${Math.floor(days/30)} mois`;
  return `il y a ${Math.floor(days/365)} an(s)`;
};

// LifeForge — View Matrix
// Questionnaire 21 questions + résultats (7 axes + 6 dimensions Z + profil)

window.LF = window.LF || {};
window.LF._mqState = { axisIdx: 0, qIdx: 0, current: [], scores: {} };

window.LF.openMatrixQuestionnaire = function() {
  window.LF._mqState = { axisIdx: 0, qIdx: 0, current: [], scores: {} };
  window.LF.go('matrix');
};

window.LF.renderMatrix = function() {
  const st = window.LF._mqState;
  const MQ = window.LF.MQ;

  // Show result si déjà rempli ou nouveau résultat à afficher
  if (st.axisIdx >= MQ.length && Object.keys(st.scores).length === 7) {
    return renderMatrixResult();
  }
  const existing = window.LF.loadMatrix();
  if (st.axisIdx === 0 && st.qIdx === 0 && st.current.length === 0 && existing && !window.LF._mqForce) {
    return renderMatrixSaved(existing);
  }

  const axData = MQ[st.axisIdx];
  if (!axData) return renderMatrixResult();
  const q = axData.questions[st.qIdx];
  const totalQ = MQ.length * 3;
  const currentStep = st.axisIdx * 3 + st.qIdx;
  const pct = Math.round((currentStep / totalQ) * 100);
  const esc = window.LF.esc;

  window.LF.$('view-matrix').innerHTML = `
    <div class="matrix-panel">
      <div class="matrix-tag">Moteur de matrices — étape ${currentStep + 1}/${totalQ}</div>
      <div style="font-size:11px;color:var(--muted2);margin-bottom:4px">Axe ${st.axisIdx + 1}/7 · ${esc(axData.name)}</div>
      ${window.LF.progressBar(pct)}
      <h2 style="margin:20px 0 16px">${esc(q.q)}</h2>
      <div class="quiz-options">
        ${q.opts.map((opt, i) => `
          <button class="quiz-opt" onclick="LF.mqAnswer(${i})">${esc(opt)}</button>
        `).join('')}
      </div>
      <div class="row" style="margin-top:18px;justify-content:space-between">
        <button class="btn btn-ghost btn-sm" onclick="LF.mqBack()" ${currentStep === 0 ? 'disabled style="opacity:.4"' : ''}>← Précédent</button>
        <button class="btn btn-ghost btn-sm" onclick="LF.go('home')">Quitter</button>
      </div>
    </div>
  `;
};

window.LF.mqAnswer = function(val) {
  const st = window.LF._mqState;
  const MQ = window.LF.MQ;
  const axData = MQ[st.axisIdx];
  st.current.push(window.LF.answerToScore(val));

  if (st.qIdx < axData.questions.length - 1) {
    st.qIdx++;
  } else {
    // Moyenne de l'axe
    const avg = st.current.reduce((a, b) => a + b, 0) / st.current.length;
    st.scores[axData.axis] = Math.round(avg * 100) / 100;
    st.current = [];
    st.qIdx = 0;
    st.axisIdx++;
  }
  window.LF.renderMatrix();
};

window.LF.mqBack = function() {
  const st = window.LF._mqState;
  if (st.qIdx > 0) {
    st.qIdx--;
    st.current.pop();
  } else if (st.axisIdx > 0) {
    st.axisIdx--;
    st.qIdx = window.LF.MQ[st.axisIdx].questions.length - 1;
    delete st.scores[window.LF.MQ[st.axisIdx].axis];
    st.current = []; // on perd les réponses de l'axe précédent par sécurité
  }
  window.LF.renderMatrix();
};

function renderMatrixSaved(mx) {
  const esc = window.LF.esc;
  const X = mx.X;
  const Z = window.LF.computeZ(X);
  const profile = mx.profile || window.LF.detectProfile(X);

  window.LF.$('view-matrix').innerHTML = `
    <div class="matrix-panel">
      <div class="matrix-tag">Profil cognitif</div>
      <h1 style="margin:6px 0 6px">${esc(profile.name)}</h1>
      <div class="muted-sm">Calibré il y a ${window.LF.relTime(mx.date)} · 7 axes</div>

      <div class="mx-scores" style="margin-top:18px">
        ${window.LF.MATRIX_AXES.map((k, i) => `
          <div class="mx-score">
            <div class="mx-score-name">${esc(window.LF.AXIS_NAMES[k])}</div>
            <div class="mx-score-val">${Math.round(X[i] * 100)}</div>
            <div class="mx-score-bar"><div class="mx-score-fill" style="width:${X[i] * 100}%"></div></div>
          </div>
        `).join('')}
      </div>

      <div class="row" style="margin-top:18px">
        <button class="btn btn-matrix" onclick="LF._mqForce=true;LF._mqState={axisIdx:0,qIdx:0,current:[],scores:{}};LF.renderMatrix()">🔁 Recalibrer</button>
        <button class="btn btn-ghost btn-sm" onclick="LF.go('home')">Retour</button>
      </div>
    </div>

    <h2 style="margin:24px 0 12px">Tes 6 dimensions pédagogiques</h2>
    <div class="grid g2">
      ${window.LF.ALL_Z.map(zd => renderZBlock(Z[zd.key], zd.color)).join('')}
    </div>
  `;
}

function renderZBlock(z, color) {
  const esc = window.LF.esc;
  return `
    <div class="z-block">
      <div class="z-title" style="color:${color}">${esc(z.title)}</div>

        <div class="z-row">

          <div class="z-pct" style="color:${color}">${z.pcts[i]}%</div>
        </div>
      `).join('')}
    </div>
  `;

function renderMatrixResult() {
  const st = window.LF._mqState;
  const X = window.LF.MATRIX_AXES.map(k => st.scores[k] || 0);
  const Z = window.LF.computeZ(X);
  const profile = window.LF.detectProfile(X);

  // Save
  const result = {
    X,
    scores: { ...st.scores },
    profile,
    date: new Date().toISOString(),
  };
  window.LF.saveMatrix(result);
  window.LF._mqForce = false;
  window.LF.toast('✨ Profil cognitif sauvegardé !');
  renderMatrixSaved(result);
}

// ─── Toggle helpers ────────────────────────────────────────────
window.LF.toggleTask = function(goalId, modId, taskId) {
  const goal = window.LF.findGoal(goalId);
  if (!goal) return;
  const mod = goal.modules.find(m => m.id === modId);
  if (!mod) return;
  const item = mod.tasks.find(t => t.id === taskId);
  if (!item) return;
  item.done = !item.done;
  if (item.done) {
    const meta = window.LF.addXP(item.impact);
    window.LF.toast(`+${item.impact} XP · Total ${meta.xp}`);
  }
  window.LF.updateGoal(goal);
  if (window.LF._currentView === 'goal') window.LF.renderGoal();
  else if (window.LF._currentView === 'today') window.LF.renderToday();
};

window.LF.toggleLesson = function(goalId, modId, lessonId) {
  const goal = window.LF.findGoal(goalId);
  if (!goal) return;
  const mod = goal.modules.find(m => m.id === modId);
  if (!mod) return;
  const item = mod.lessons.find(l => l.id === lessonId);
  if (!item) return;
  item.done = !item.done;
  if (item.done) {
    const meta = window.LF.addXP(item.impact);
    window.LF.toast(`+${item.impact} XP · Total ${meta.xp}`);
  }
  window.LF.updateGoal(goal);
  if (window.LF._currentView === 'goal') window.LF.renderGoal();
  else if (window.LF._currentView === 'today') window.LF.renderToday();
  else if (window.LF._currentView === 'lesson') window.LF.renderLesson();
};

window.LF.SB_URL = 'https://tbaphoaqyndoeihmivog.supabase.co';

window.LF.sbKey = function() {
  return localStorage.getItem('lf_supabase_key') || '';
};

window.LF.sbFetch = async function(path, method, body, extraHeaders) {
  const key = window.LF.sbKey();
  const url = window.LF.SB_URL + path;
  const headers = Object.assign({
    'apikey': key,
    'Authorization': 'Bearer ' + key,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  }, extraHeaders || {});
  const opts = { method: method || 'GET', headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    throw new Error('SB ' + res.status + ' ' + txt.slice(0,120));
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
};

window.LF.upsertProfile = async function() {
  const axes = window.LF.getAxes() || {};
  const doms = window.LF.getDoms();
  const role = window.LF.getRole();
  const existing = localStorage.getItem('lf_sb_profile');
  try {
    let profile;
    if (existing) {
      const p = JSON.parse(existing);
      profile = await window.LF.sbPatch('profiles', 'id=eq.' + p.id, {
        role, avatar_axes: axes, learn_domains: doms, updated_at: new Date().toISOString()
      });
      profile = Array.isArray(profile) ? profile[0] : profile;
    } else {
      profile = await window.LF.sbPost('profiles', {
        role, avatar_axes: axes, learn_domains: doms
      });
      profile = Array.isArray(profile) ? profile[0] : profile;
      if (profile && profile.id) localStorage.setItem('lf_sb_profile', JSON.stringify(profile));
    }
    window.LF._sbUserId = profile && profile.id;
  } catch(e) { console.warn('upsertProfile:', e.message); }
};

      <div class="ob-step">
        <div style="text-align:center;font-size:48px;margin-bottom:12px">⚡</div>

window.LF.obStep1Next = async function() {
  const inp = document.getElementById('ob-key-inp');
  const status = document.getElementById('ob-key-status');
  const key = (inp.value || '').trim();
  if (!key) { status.textContent = '⚠️ Entre une clé anon valide'; return; }
  status.textContent = '⏳ Vérification en cours…';
  localStorage.setItem(K_SB, key);
  const ok = await window.LF.sbPing();
  if (ok) {
    status.innerHTML = '<span class="sb-status sb-ok">✓ Connexion Supabase OK</span>';
    setTimeout(() => { window.LF._obStep = 2; window.LF.renderObStep(); }, 600);
  } else {
    status.innerHTML = '<span class="sb-status sb-fail">✗ Clé invalide ou réseau inaccessible</span>';
  }
};

window.LF.obSkipKey = function() {
  window.LF._obStep = 2;
  window.LF.renderObStep();
};

window.LF.obStep2Next = function() {
  window.LF.setAxes(window.LF._obAxes);
  window.LF._obStep = 3;
  window.LF.renderObStep();
};

window.LF.obToggleDom = function(el, d) {
  const idx = window.LF._obDoms.indexOf(d);
  if (idx === -1) window.LF._obDoms.push(d);
  else window.LF._obDoms.splice(idx, 1);
  el.classList.toggle('sel');
};

window.LF.obFinish = async function() {
  window.LF.setAxes(window.LF._obAxes);
  window.LF.setDoms(window.LF._obDoms);
  window.LF.setObDone();
  window.LF.hideOnboarding();
  window.LF.toast('Bienvenue sur LifeForge ! 🚀');
  if (window.LF.sbKey()) {
    try { await window.LF.upsertProfile(); } catch {}
  }
  window.LF.go('home');
};

window.LF._loadMentors = async function() {
  const filterBar = window.LF.$('mentor-filter-bar');
  const grid = window.LF.$('mentor-grid');
  const FREE_LIMIT = 3;

  let mentors = [];
  try {
    mentors = await window.LF.sbGet('profiles',
      'role=eq.mentor&select=id,display_name,bio,avatar_emoji,learn_domains,avatar_axes&limit=20');
    if (!Array.isArray(mentors)) mentors = [];
  } catch(e) {
    mentors = window.LF._fakeMentors();
  }

  if (mentors.length === 0) mentors = window.LF._fakeMentors();
  window.LF._mentors = mentors;

  const allDoms = ['Tous'];
  mentors.forEach(m => (m.learn_domains || []).forEach(d => { if (!allDoms.includes(d)) allDoms.push(d); }));

  filterBar.innerHTML = allDoms.map(d =>
    `<div class="mf-chip${d===window.LF._mentorFilter?' active':''}" onclick="LF._mentorFilter='${window.LF.esc(d)}';LF._renderMentorGrid()">${d}</div>`
  ).join('');

  if (mentors.length > FREE_LIMIT) {
    window.LF.$('mentor-freemium-bar').style.display = 'block';
  }
  window.LF._renderMentorGrid();
};

window.LF._renderMentorGrid = function() {
  const grid = window.LF.$('mentor-grid');
  if (!grid) return;
  const FREE_LIMIT = 3;
  const filter = window.LF._mentorFilter;
  let list = window.LF._mentors;
  if (filter !== 'Tous') {
    list = list.filter(m => (m.learn_domains || []).includes(filter));
  }
  if (list.length === 0) {
    grid.innerHTML = `<div class="muted" style="text-align:center;padding:40px">Aucun mentor dans ce domaine pour l'instant.</div>`;
    return;
  }
  grid.innerHTML = list.map((m, i) => {
    const locked = i >= FREE_LIMIT;
    const emoji = m.avatar_emoji || '🧑';
    const name = window.LF.esc(m.display_name || 'Mentor');
    const bio = window.LF.esc((m.bio || 'Partage son expertise avec la communauté LifeForge.').slice(0,90));
    const domains = (m.learn_domains || []).slice(0,3).map(d =>
      `<span class="chip" style="font-size:10px">${window.LF.esc(d)}</span>`).join('');
    return `
      <div class="mentor-card" onclick="${locked ? "LF.toast('Passe Premium pour accéder à ce mentor 🔒','error')" : "LF.openChat('"+m.id+"','"+name+"','"+emoji+"')"}">
        <div class="mentor-avatar" style="background:rgba(192,132,252,.12)">${emoji}</div>
        <div class="mentor-name">${name}</div>
        <div class="mentor-bio">${bio}</div>
        <div class="row">${domains}</div>
        ${locked ? `<div class="mentor-lock"><div style="font-size:28px">🔒</div><div class="lock-badge">Premium</div><div style="font-size:11px;color:var(--muted2)">Mentor ${i+1}</div></div>` : ''}
      </div>`;
  }).join('');
};

window.LF._msgPollTimer = null;
window.LF._currentChat  = null;  // { id, name, emoji }
window.LF._msgCount     = {};    // { conv_id: count }

window.LF.renderMessages = async function() {
  const el = window.LF.$('view-messages');
  el.innerHTML = `<h1 style="margin-bottom:18px">Messages</h1><div id="msg-body"><div class="muted" style="text-align:center;padding:40px">Chargement…</div></div>`;
  await window.LF._loadConversations();
  window.LF._startMsgPoll();
};

window.LF._loadConversations = async function() {
  const body = window.LF.$('msg-body');
  if (!body) return;
  const uid = window.LF.getSbUserId();
  let convs = [];
  try {
    if (uid) {
      const msgs = await window.LF.sbGet('messages',
        `or=(sender_id.eq.${uid},receiver_id.eq.${uid})&order=created_at.desc&limit=50`);
      const seen = {};
      (msgs || []).forEach(m => {
        const other = m.sender_id === uid ? m.receiver_id : m.sender_id;
        if (!seen[other]) { seen[other] = m; convs.push({ partner_id: other, last: m }); }
      });
    }
  } catch {}

  if (convs.length === 0 && window.LF._currentChat) {
    const c = window.LF._currentChat;
    convs = [{ partner_id: c.id, last: null, _demo: c }];
  }

  if (convs.length === 0) {
    body.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <div style="font-size:40px;margin-bottom:12px">💬</div>
      <h3>Aucun message</h3>
      <p class="muted" style="font-size:13px;margin-top:6px">Va dans l&#39;onglet Mentors et contacte quelqu&#39;un pour démarrer.</p>
    </div>`;
    return;
  }

  body.innerHTML = `<div class="msg-list">
    ${convs.map(c => {
      const demo = c._demo;
      const emoji = demo ? demo.emoji : '🧑';
      const name  = demo ? demo.name  : (c.partner_id || '').slice(0,8);
      const preview = c.last ? c.last.content.slice(0,40) : 'Nouvelle conversation';
      const time  = c.last ? window.LF.relTime(c.last.created_at) : '';
      return `<div class="msg-conv" onclick="LF.openChat('${c.partner_id}','${window.LF.esc(name)}','${emoji}')">
        <div class="msg-conv-avatar" style="background:rgba(192,132,252,.12)">${emoji}</div>
        <div style="flex:1;min-width:0">
          <div class="msg-conv-name">${window.LF.esc(name)}</div>
          <div class="msg-conv-preview">${window.LF.esc(preview)}</div>
        </div>
        <div class="msg-conv-time">${time}</div>
      </div>`;
    }).join('')}
  </div>`;
};

window.LF.openChat = function(partnerId, partnerName, partnerEmoji) {
  window.LF._currentChat = { id: partnerId, name: partnerName, emoji: partnerEmoji || '🧑' };
  window.LF.go('messages');
  setTimeout(() => window.LF._renderChat(), 50);
};

window.LF._renderChat = async function() {
  const c = window.LF._currentChat;
  if (!c) return;
  const body = window.LF.$('msg-body');
  if (!body) return;

  body.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-header">
        <button class="btn btn-ghost btn-sm" onclick="LF._currentChat=null;LF._loadConversations()">←</button>
        <div style="width:38px;height:38px;border-radius:50%;background:rgba(192,132,252,.12);display:grid;place-items:center;font-size:20px">${window.LF.esc(c.emoji)}</div>
        <div>
          <div style="font-weight:700">${window.LF.esc(c.name)}</div>
          <div class="muted-sm">Mentor LifeForge</div>
        </div>
      </div>
      <div class="chat-msgs" id="chat-msgs-list"></div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-txt" rows="1" placeholder="Écris un message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();LF.sendMsg()}"></textarea>
        <button class="btn btn-primary btn-sm" style="align-self:flex-end" onclick="LF.sendMsg()">Envoyer</button>
      </div>
    </div>`;
  await window.LF._pollChat();
};

window.LF._pollChat = async function() {
  const c = window.LF._currentChat;
  const el = window.LF.$('chat-msgs-list');
  if (!c || !el) return;
  const uid = window.LF.getSbUserId();
  let msgs = [];
  try {
    if (uid) {
      msgs = await window.LF.sbGet('messages',
        `or=(and(sender_id.eq.${uid},receiver_id.eq.${c.id}),and(sender_id.eq.${c.id},receiver_id.eq.${uid}))&order=created_at.asc&limit=100`);
    }
  } catch {}

  if (!Array.isArray(msgs)) msgs = [];

  if (msgs.length === 0) {
    el.innerHTML = `<div class="muted" style="text-align:center;padding:20px;font-size:13px">Envoie un premier message 👋</div>`;
  } else {
    el.innerHTML = msgs.map(m => {
      const mine = m.sender_id === uid;
      return `<div>
        <div class="chat-bubble ${mine ? 'me' : 'them'}">${window.LF.esc(m.content)}</div>
        <div class="chat-bubble-time" style="${mine ? '' : 'text-align:left'}">${window.LF.relTime(m.created_at)}</div>
      </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;

    // Trigger satisfaction after 3 messages
    const convKey = 'lf_sat_' + c.id;
    const prevCount = window.LF._msgCount[c.id] || 0;
    window.LF._msgCount[c.id] = msgs.length;
    if (msgs.length >= 3 && prevCount < 3 && !localStorage.getItem(convKey)) {
      setTimeout(() => window.LF.showSatisfaction(c.id, c.name), 1000);
    }
  }
};

window.LF.sendMsg = async function() {
  const txt = (document.getElementById('chat-txt') || {}).value || '';
  if (!txt.trim()) return;
  const c = window.LF._currentChat;
  const uid = window.LF.getSbUserId();
  document.getElementById('chat-txt').value = '';
  try {
    await window.LF.sbPost('messages', {
      sender_id: uid || 'anon',
      receiver_id: c.id,
      content: txt.trim()
    });
    await window.LF._pollChat();
  } catch(e) {
    window.LF.toast('Erreur envoi message', 'error');
  }
};

window.LF._startMsgPoll = function() {
  window.LF._stopMsgPoll();
  window.LF._msgPollTimer = setInterval(async () => {
    if (window.LF._currentView !== 'messages') { window.LF._stopMsgPoll(); return; }
    if (window.LF._currentChat) await window.LF._pollChat();
    else await window.LF._loadConversations();
  }, 5000);
};

window.LF._stopMsgPoll = function() {
  if (window.LF._msgPollTimer) { clearInterval(window.LF._msgPollTimer); window.LF._msgPollTimer = null; }
};

/* ─── Satisfaction questionnaire ──────────────────────────── */
window.LF.showSatisfaction = function(partnerId, partnerName) {
  window.LF._satStars = 0;
  window.LF.modal(`
    <h2 class="modal-title">Comment s'est passé l'échange ?</h2>
    <p class="muted" style="font-size:13px;margin-top:4px">3 messages échangés avec ${window.LF.esc(partnerName)} 🎉</p>
    <div class="sat-stars" id="sat-stars">
      ${[1,2,3,4,5].map(i => `<div class="sat-star" data-n="${i}" onclick="LF._satRate(${i})">⭐</div>`).join('')}
    </div>
    <textarea class="chat-input" id="sat-comment" style="height:70px;margin-top:4px" placeholder="Un commentaire (optionnel)…"></textarea>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn btn-ghost" onclick="LF.closeModal();localStorage.setItem('lf_sat_${partnerId}','skip')">Passer</button>
      <button class="btn btn-primary" onclick="LF.submitSatisfaction('${partnerId}')">Envoyer</button>
    </div>
  `);
};

window.LF._satRate = function(n) {
  window.LF._satStars = n;
  document.querySelectorAll('.sat-star').forEach((s, i) => s.classList.toggle('lit', i < n));
};

window.LF.submitSatisfaction = async function(partnerId) {
  const stars = window.LF._satStars;
  const comment = (document.getElementById('sat-comment') || {}).value || '';
  if (!stars) { window.LF.toast('Clique sur une étoile d\'abord', 'error'); return; }
  localStorage.setItem('lf_sat_' + partnerId, stars);
  try {
    const uid = window.LF.getSbUserId();
    await window.LF.sbPost('satisfactions', {
      from_user_id: uid || 'anon',
      to_user_id: partnerId,
      stars,
      comment: comment.trim()
    });
  } catch {}
  window.LF.closeModal();
  window.LF.addXP(20);
  window.LF.toast('Merci pour ton retour ! +20 XP ⭐');
};

window.LF._missionsCache = null;

const DEFAULT_MISSIONS = [
  { id:'m1', title:'Compléter ton avatar de vie',          desc:'Remplis les 8 axes de ton avatar pour personnaliser tes recommandations.', xp:50,  type:'onboarding', check:()=> !!window.LF.getAxes() },
  { id:'m2', title:'Contacter ton premier mentor',         desc:'Envoie un message à un mentor de la communauté LifeForge.',               xp:100, type:'social',     check:()=> Object.keys(window.LF._msgCount||{}).length > 0 },
  { id:'m3', title:'Valider 5 actions de formation',       desc:'Coche 5 leçons ou tâches dans un de tes programmes actifs.',              xp:75,  type:'learning',   check:()=> (window.LF.loadMeta().totalDone||0) >= 5 },
  { id:'m4', title:'Atteindre un streak de 3 jours',      desc:'Reviens sur LifeForge 3 jours consécutifs.',                              xp:60,  type:'streak',     check:()=> (window.LF.loadMeta().streak||0) >= 3 },
  { id:'m5', title:'Laisser un avis à un mentor',         desc:'Évalue un mentor après votre échange pour débloquer les XP bonus.',       xp:40,  type:'social',     check:()=> Object.keys(localStorage).some(k=>k.startsWith('lf_sat_')&&localStorage.getItem(k)!=='skip') },
  { id:'m6', title:'Créer un objectif de formation',      desc:'Lance ton premier programme personnalisé depuis le catalogue.',            xp:30,  type:'learning',   check:()=> window.LF.loadGoals().length > 0 },
  { id:'m7', title:'Explorer 3 domaines différents',      desc:'Parcours au moins 3 sous-domaines dans le Catalogue.',                    xp:25,  type:'learning',   check:()=> false },
  { id:'m8', title:'Partager ton profil cognitif',        desc:'Complète le moteur de matrices 🧬 pour débloquer ton archétype.',         xp:80,  type:'onboarding', check:()=> !!window.LF.loadMatrix() },
];

window.LF.renderMissions = async function() {
  const el = window.LF.$('view-missions');
  el.innerHTML = `<h1 style="margin-bottom:6px">Missions</h1>
    <p class="muted" style="font-size:13px;margin-bottom:18px">Complète des défis pour gagner des XP et progresser sur LifeForge.</p>
    <div id="missions-list"><div class="muted" style="text-align:center;padding:30px">Chargement…</div></div>`;

  let missions = DEFAULT_MISSIONS;
  try {
    if (window.LF.sbKey()) {
      const remote = await window.LF.sbGet('missions', 'active=eq.true&order=xp_reward.desc&limit=20');
      if (Array.isArray(remote) && remote.length > 0) {
        missions = remote.map(m => ({
          id: m.id, title: m.title, desc: m.description,
          xp: m.xp_reward || 50, type: m.type || 'learning',
          check: () => !!localStorage.getItem('lf_mission_done_' + m.id)
        }));
      }
    }
  } catch {}

  window.LF._renderMissionsList(missions);
};

window.LF._renderMissionsList = function(missions) {
  const el = window.LF.$('missions-list');
  if (!el) return;
  const typeColor = { onboarding:'var(--c1)', social:'var(--p1)', learning:'var(--v1)', streak:'var(--o1)' };
  const typeLabel = { onboarding:'Démarrage', social:'Social', learning:'Formation', streak:'Streak' };

  const done   = missions.filter(m => m.check());
  const pending = missions.filter(m => !m.check());

  el.innerHTML = `
    <div style="margin-bottom:8px;font-size:12px;color:var(--muted2)">${done.length}/${missions.length} missions complétées</div>
    <div class="bar-wrap" style="margin-bottom:20px"><div class="bar-fill" style="width:${Math.round(done.length/missions.length*100)}%"></div></div>
    ${[...pending, ...done].map(m => {
      const isDone = m.check();
      const col = typeColor[m.type] || 'var(--v1)';
      return `<div class="mission-card${isDone?' done':''}" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <span class="mission-xp">+${m.xp} XP</span>
            <div style="font-weight:700;font-size:14px;margin-bottom:4px">${window.LF.esc(m.title)}</div>
            <div style="font-size:12px;color:var(--muted2);line-height:1.5">${window.LF.esc(m.desc)}</div>
            <div style="margin-top:8px"><span style="font-size:10px;color:${col};font-weight:700;text-transform:uppercase;letter-spacing:.05em">${typeLabel[m.type]||m.type}</span></div>
          </div>
          <div style="flex-shrink:0">
            ${isDone
              ? `<div style="font-size:24px">✅</div>`
              : `<button class="btn btn-ghost btn-sm" onclick="LF.completeMission('${m.id}',${m.xp})">Valider</button>`
            }
          </div>
        </div>
      </div>`;
    }).join('')}
  `;
};

window.LF.completeMission = async function(id, xp) {
  localStorage.setItem('lf_mission_done_' + id, '1');
  window.LF.addXP(xp || 50);
  window.LF.toast(`Mission validée ! +${xp || 50} XP 🎉`);
  try {
    const uid = window.LF.getSbUserId();
    if (uid) await window.LF.sbPost('satisfactions', { type:'mission', mission_id: id, user_id: uid });
  } catch {}
  window.LF.renderMissions();
};

// LifeForge — Router (commute entre les views et déclenche le render adapté)

window.LF = window.LF || {};
window.LF._currentView = 'home';

const VIEWS = ['home', 'today', 'goals', 'goal', 'lesson', 'matrix', 'search', 'profile', 'mentors', 'missions', 'messages'];

window.LF.go = function(view) {
  if (!VIEWS.includes(view)) view = 'home';
  if (view !== 'messages') window.LF._stopMsgPoll && window.LF._stopMsgPoll();
  window.LF._currentView = view;
  // Hide all, show target
  for (const v of VIEWS) {
    const el = window.LF.$('view-' + v);
    if (el) el.style.display = (v === view) ? 'block' : 'none';
  }
  // Update active pill
  for (const pill of window.LF.$$('.pill[data-view]')) {
    pill.classList.toggle('active', pill.dataset.view === view);
  }
  // Render
  const r = {
    home: window.LF.renderHome,
    today: window.LF.renderToday,
    goals: window.LF.renderGoals,
    goal: window.LF.renderGoal,
    lesson: window.LF.renderLesson,
    matrix: window.LF.renderMatrix,
    search: window.LF.renderSearch,
    profile: window.LF.renderProfile,
    mentors: window.LF.renderMentors,
    missions: window.LF.renderMissions,
    messages: window.LF.renderMessages,
  };
  (r[view] || r.home)();
  // Scroll top for content views (except quiz steps inside matrix)
  if (view !== 'lesson') window.scrollTo({ top: 0, behavior: 'smooth' });
};


/* ─── APP BOOT ─────────────────────────────────────────── */
// LifeForge — Entry point
// Initialise l'app et déclenche le premier render.

(function() {
  // Sanity check : tous les modules présents ?
  const required = ['KB', 'DOMAIN_META', 'MQ', 'computeZ', 'detectProfile',
                    'generateFullProgram', 'searchKB', 'loadGoals', 'go',
                    'renderHome', 'renderToday', 'renderGoals', 'renderMatrix',
                    'renderSearch', 'renderProfile'];
  const missing = required.filter(k => typeof window.LF[k] === 'undefined');
  if (missing.length > 0) {
    document.body.innerHTML = `<div style="padding:40px;color:#fff;font-family:system-ui">
      <h1 style="color:#f87171">⚠️ Erreur de chargement</h1>
      <p>Modules manquants : ${missing.join(', ')}</p>
      <p>Recharge la page (Cmd-R / F5).</p>
    </div>`;
    return;
  }

  // Migration : si l'utilisateur a déjà des données v8 (de v19.html), on les détecte.
  // On NE migre PAS automatiquement pour éviter d'écraser : on propose juste un import.
  function detectLegacy() {
    try {
      const oldGoals = localStorage.getItem('lf_v8_goals');
      const oldMeta  = localStorage.getItem('lf_v8_meta');
      const currentGoals = localStorage.getItem('lf_final_goals');
      if (oldGoals && !currentGoals) {
        return { goals: oldGoals, meta: oldMeta };
      }
    } catch {}
    return null;
  }

  window.LF.importLegacy = function() {
    const l = detectLegacy();
    if (!l) return window.LF.toast('Rien à importer');
    try {
      if (l.goals) localStorage.setItem('lf_final_goals', l.goals);
      if (l.meta)  localStorage.setItem('lf_final_meta',  l.meta);
      window.LF.toast('Import terminé ✨');
      window.LF.go('home');
    } catch (e) {
      window.LF.toast('Erreur import', 'error');
    }
  };

  // First render
  window.LF.go('home');

  // v22: show onboarding on first launch (no key stored yet)
  if (!window.LF.obDone()) {
    setTimeout(() => {
      window.LF._obAxes = window.LF.getAxes() || {};
      window.LF._obDoms = window.LF.getDoms() || [];
      window.LF.showOnboarding(1);
    }, 300);
  }

  // Proposer import si données legacy détectées
  const legacy = detectLegacy();
  if (legacy) {
    setTimeout(() => {
      window.LF.modal(`
        <h2 class="modal-title">✨ Anciennes données détectées</h2>
        <p class="muted" style="font-size:14px;line-height:1.6">
          Tu as utilisé une version précédente de LifeForge (v19) sur ce navigateur.
          Veux-tu importer tes anciens objectifs et ton XP dans la version finale ?
        </p>
        <p class="muted-sm" style="margin-top:8px">Aucune donnée ne sera perdue, même si tu refuses : les anciennes restent intactes dans leurs clés.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="LF.closeModal()">Plus tard</button>
          <button class="btn btn-primary" onclick="LF.importLegacy();LF.closeModal()">Importer ✨</button>
        </div>
      `);
    }, 500);
  }

  // Welcome onboard si premier passage et pas de matrix
  if (!window.LF.loadMatrix() && window.LF.loadGoals().length === 0 && !legacy) {
    // soft prompt après 2s
    setTimeout(() => {
      if (window.LF._currentView !== 'home') return;
      window.LF.toast('💡 Astuce : commence par le profilage en 21 questions');
    }, 1500);
  }

  // Raccourcis clavier
  document.addEventListener('keydown', function(e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const map = { h: 'home', t: 'today', g: 'goals', s: 'search', m: 'matrix', p: 'profile', n: 'mentors', i: 'missions', c: 'messages' };
    if (map[e.key]) window.LF.go(map[e.key]);
    if (e.key === 'Escape') window.LF.closeModal();
  });

  console.log('%c🧬 LifeForge ready', 'background:#c084fc;color:#060608;padding:4px 8px;border-radius:4px;font-weight:700',
              '· KB:', window.LF.KB.length, 'formations',
              '· Goals:', window.LF.loadGoals().length);
})();

</script>
